[project]
name = "posesim"
version = "0.0.1"
description = "Multi-person 3D pose to interactive sound sculpture simulation"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/posesim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real models, processes or network; excluded from the fast gate"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["python", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["python", "scripts"]
typeCheckingMode = "standard"
